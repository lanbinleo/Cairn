[package]
name = "cairn"
version = "0.1.0"
description = "CAIRN trading journal desktop app"
authors = ["CAIRN"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
